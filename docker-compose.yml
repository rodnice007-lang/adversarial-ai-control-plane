# Active development target: MSI Vector 16 HX (Windows 11 Pro, RTX 5070 Ti).
# Docker Desktop's WSL2 backend runs these containers -- see README for the
# isolation-trigger caveat that comes with that. The Minisforum becomes the
# 24/7 production host later, once Network+ is done -- see README roadmap.
# PROJECT_DATA_PATH should point at wherever project data lives on this host.

networks:
  edge:
    driver: bridge
  model-internal:
    driver: bridge
    internal: true
  state-internal:
    driver: bridge
    internal: true

services:
  control-plane:
    build: .
    container_name: control-plane
    networks:
      - edge
      - model-internal
      - state-internal
    ports:
      - "8443:8443"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set -- no default}
      - ADMIN_API_KEY=${ADMIN_API_KEY:?ADMIN_API_KEY must be set -- no default}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-qwen2.5:3b}
    volumes:
      - ${PROJECT_DATA_PATH:-./data}/logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - ollama
      - redis

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    networks:
      - model-internal
    volumes:
      - ${PROJECT_DATA_PATH:-./data}/ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set -- no default}
    networks:
      - state-internal
    volumes:
      - ${PROJECT_DATA_PATH:-./data}/redis:/data
